# Local development ONLY — Postgres + Redis for `php artisan serve` / `npm run dev`.
# Production uses Coolify: the Dockerfile builds the app, and Postgres/Redis are
# separate Coolify resources (see README).
name: neaby-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: neaby
      POSTGRES_USER: neaby
      POSTGRES_PASSWORD: neaby
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neaby -d neaby"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
